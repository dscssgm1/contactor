[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contacter-server"
version = "0.1.0"
description = "Public UDP relay server for Contacter"
requires-python = ">=3.10"

[project.scripts]
contacter-server = "contacter_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["contacter_server*", "contacter_wire*"]

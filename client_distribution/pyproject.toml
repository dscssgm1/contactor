[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contacter-client"
version = "0.1.0"
description = "B-side and A-side clients for Contacter UDP relay"
requires-python = ">=3.10"

[project.scripts]
contacter-client = "contacter_client.client:main"
contacter-a-client = "contacter_client.a_client_app:main"

[tool.setuptools.packages.find]
where = ["src"]
